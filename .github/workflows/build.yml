name: Build and Sign APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle
    
    - name: Validate Gradle wrapper
      uses: gradle/wrapper-validation-action@v1
    
    - name: Make gradlew executable
      run: chmod +x ./gradlew
    
    - name: Build APK (Debug)
      run: ./gradlew assembleDebug
    
    - name: Build APK (Release)
      run: ./gradlew assembleRelease
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    
    - name: Sign APK
      id: sign_apk
      run: |
        # Decode and save keystore from base64
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ./keystore.jks
        echo "APK signed successfully"
        ls -lh build/outputs/apk/release/
    
    - name: Upload APK to release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: FileManager-APK
        path: |
          build/outputs/apk/debug/app-debug.apk
          build/outputs/apk/release/app-release.apk
    
    - name: Create Release with APK
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          build/outputs/apk/release/app-release.apk
          build/outputs/apk/debug/app-debug.apk
        tag_name: v1.0-${{ github.run_number }}
        draft: false
        prerelease: false
        body: |
          ## File Manager APK Build
          
          Automated build from GitHub Actions
          
          ### Files:
          - **app-release.apk** - Signed release build
          - **app-debug.apk** - Debug build
          
          ### Installation:
          ```bash
          adb install app-release.apk
          ```
          
          Build #${{ github.run_number }}
          Commit: ${{ github.sha }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
